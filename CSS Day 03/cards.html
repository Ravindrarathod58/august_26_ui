<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />

    <style>
      * {
        font-family: monospace;
        font-size: 1.2rem;
      }
      .container {
        /* addidtional prop */
        display: flex;
        justify-content: space-around;
      }
      .card {
        /* border: 1px solid; */
        box-shadow: 0 0 10px gray;
        height: 200px;
        width: 13%;
        border-radius: 10px;

        /* addidtional prop */
        display: flex;
        justify-content: space-around;
        flex-direction: column;
        align-items: center;
        /* transition: transform 0.5s ease-in-out; */
      }

      .java {
        color: red;
      }

      /* .card:hover {
        transform: translateY(-10px);
        cursor: pointer;
      } */
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="icon">
          <i
            class="devicon-java-plain"
            style="font-size: 100px; color: red"
          ></i>
        </div>
        <div class="text">
          <span class="java">Java</span>
        </div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-python-plain"
            style="font-size: 100px; color: yellow"
          ></i>
        </div>
        <div class="text py">Python</div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-spring-original"
            style="font-size: 100px; color: green"
          ></i>
        </div>
        <div class="text spring">Spring</div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-github-original"
            style="font-size: 100px; color: black"
          ></i>
        </div>
        <div class="text git">Github</div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-docker-plain"
            style="font-size: 100px; color: blue"
          ></i>
        </div>
        <div class="text docker">Docker</div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-amazonwebservices-plain-wordmark"
            style="font-size: 100px; color: orange"
          ></i>
        </div>
        <div class="text aws">AWS</div>
      </div>
      <div class="card">
        <div class="icon">
          <i
            class="devicon-postman-plain"
            style="font-size: 100px; color: orangered"
          >
          </i>
        </div>
        <div class="text post">Postman</div>
      </div>
    </div>
  </body>
</html>
