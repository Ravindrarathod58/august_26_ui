<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="login.css" />

    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
  </head>
  <body>
    <div class="login-container">
      <div class="close">
        <span class="material-symbols-outlined"> close </span>
      </div>
      <div class="text-content">
        <p class="sign">Sign In</p>
        <p class="txt-content">Get access to more learning features</p>
        <p class="register">Dont have an account? <a href="">Register</a></p>
      </div>
      <div class="login-options">
        <div class="cards">
          <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/google/google-original.svg"
            height="35px"
          />
        </div>
        <div class="cards"><i class="devicon-github-original"></i></div>
        <div class="cards">
          <i class="devicon-facebook-plain" style="color: blue"></i>
        </div>
        <div class="cards"><i class="devicon-twitter-original"></i></div>
      </div>
      <div class="devider"><span>or</span></div>
      <form action="">
        <div class="input-group">
          <input type="email" placeholder="email" />
        </div>
        <div class="input-group">
          <input type="password" placeholder="password" />
        </div>
        <div class="input-group">
          <a href="">Forget Password?</a>
        </div>
        <div class="input-group">
          <input type="submit" value="Sign In" />
        </div>
      </form>
    </div>
  </body>
</html>
