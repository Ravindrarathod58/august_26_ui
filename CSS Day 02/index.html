        borders in the CSS
            borders are the edges of every HTML tag
            if we want to make these edges visible then in the css we use border property

            diffrent style in border
            border-style :
                adds the border style to the html element
                the default value of the border style property is transparent
                1. solid
                2. dashed - adds the dashed border
                3. dotted
                4. ridge
                5. groove
            border- width
                    it controls the visiblity thikness

            border-color
                adds the color to the border

            shorthand
                combination of multiple properties
            border : width, style, color

            targeting individual borders
            border-top
            border-bottom
            border-right
            border-left

            controlling the edges of the border
            border-radius
            
            we can controll the individual edges
            border-top-left-radius
            border-top-right-radius
            border-bottom-left-radius
            border-bottom -right-radius

            creating circle
            the element should the same height and width
            then apply the border-radius 50% 

    typography
        if we want to the the text then we have some properties

        1. font-size 
                incr / decr the size of text

        2. letter spacing
                adds the space between two letters

        3. word spacing
                adds the space between two words

        4. line height
                constrols the space between two line
        

        5. text-shadow
            adds the shadow to the text
            text-shadow : x y blur radius color

        6. text-align
            center, start, end
        8. text-decoration
            underline, overline
        9. font-weight
            bold, bolder, boldest, lighter
            100 - 900

        10. font family
            to change the font faces
            1. times new roman
            2. sans serif
            3. cursive
        
            third party 
                google fonts , 

    Units of mesurement
        1. px
            smallest dot the screen
        2. rem
            reference to the root element
            1rem = base font size of the root element (16px 1rem = 16px)
            16 * 1 = 16
            2rem 
            16 * 2 = 32
        3. em
            refrence to the parent element
            32 = 1em = 32
            2em = 32 * 2 = 64
        4. ch
            smallest character in text

        5. in
        6. cm
