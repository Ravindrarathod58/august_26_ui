        Utility classes
        css framework library
      background color
        variables
            to store the values
            1. global

                global varible can be only declared inside the root selector
            2. local variable
                we can only use inside the block

            to use the values stored in variable we can use var() function

        Modules
            we can maintain the css codes in multiple files
