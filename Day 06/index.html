    <!-- creating form -->
    <form action="sdcsd" method="get">
      <!-- plain single word or single line -->
      <label for="username">Enter Username</label>
      <input
        type="text"
        id="username"
        name="username"
        placeholder="enter username"
        required
      /><br />
      <!-- hidden by default  -->
      <label for="password">Enter Password</label>
      <input type="password" id="password" name="password" /><br />
      <!-- number as input -->
      <!-- <label for="number">Enter a Number</label>
      <input type="number" id="number" /><br /> -->
      <!-- only accept email -->
      <!-- <label for="email">Enter email </label>
      <input type="email" id="email" /><br /> -->

      <label for="option1">
        <input type="radio" id="option1" name="option" value="option1" /> Option
        1
      </label>
      <label for="option2">

        2
      </label>
      <label for="option3">

        3
      </label>

        4
      </label>
      <label for="option5">
        <input type="radio" id="option5" name="option" value="option5" /> Option
        5
      </label>
      <!-- resets the form controls -->
      <button type="reset">Reset</button>
      <!-- submits the form to given action URL -->
      <button type="submit">Submit</button><br />
      <!-- <input type="submit" />
      <input type="reset" /> -->
    </form>
