    <!-- 

        UI / UX
            User interface / User experience

        CSS
            Cascading Style sheet used to style the webpages
        
            Syntax
                selector
                    selector is identifier of the element
                    
                p -> tagname itself is a selector

                p {
                    // key : value
                    color : red;
                
                }
                
        3 ways to add Css to webpage
        1. inline CSS
            using style attribute 
            less readability and reusability

        2. internal CSS
            using style tag in head section and target the element using selector

        3. external CSS
            by creating the new .css file and using link tag add the .css file to the webpage
    
        priorities
            4. custom priority
                !important
            1. inline css
            2. internal CSS
            3. external CSS

        color
            keywords , red, green, blue
            hexadecimal , #ff11ff
            rgb  (0,0,0, 0), 0-255, 0-255, 0-255, 0 - 1 (Alpha value)
           
        background-color
        background-image
                URL() // image
                linear-gradient - color combination linear
                radial-gradient - color combination  circle

        background-repeat
                repeat
                no-repeat
                repeat-x
                repeat-y
        background-position
                center
                left    / top, bottom, center
                right  / top, bottom, center
                top    / top, bottom, center
                bottom  / top, bottom, center

        background-size
                cover
                contain
                fill
                custom
        
        borders


      
    Typography
