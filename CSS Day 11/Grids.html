      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        border: 1px solid;
      }

      .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /*  1080px -> 3fr -> 1fr */
      }
      aside {
        height: 80vh;
      }
      main {
        height: 80vh;
        width: 60vw;
      }
      header {
        height: 10vh;
        grid-column: 1/4;
      }
      nav {
        height: 10vh;
        grid-column: 1/4;
      }
    </style>
  </head>
  <body>
    <!-- 
    
        Grids in CSS
            grid is two dimensional layout system in CSS
        
        display : grid;
        it converts the container into grid container

        we have to set the number of columns or number of rows

    -->
