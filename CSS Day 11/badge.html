<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        position: relative;
        border: 1px solid;
        width: 20%;
        height: 60px;
        border-radius: 10px;
        background-color: #a3cffb59;
        border-color: #a3cffbb3;
      }
      .content {
        display: flex;
        width: 100%;
        justify-content: space-around;
        align-items: center;
      }
      .new {
        display: inline-block;
        position: absolute;
        /* border: 1px solid; */
        top: -8px;
        right: 7px;
        font-size: 11px;
        border-radius: 5px;
        width: 30px;
        text-align: center;
        background-color: #ffc107;

        /* Body */
      }
      img {
        height: 50px;
      }
      .text p {
        font-weight: bold;
      }
      .text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <span class="new">New</span>
        <div class="content">
          <img src="image.png" alt="" />
          <div class="text">
            <p>W3Schools app</p>
            <span>Start the adventure</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
